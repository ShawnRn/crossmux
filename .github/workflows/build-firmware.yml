name: Build InkLink Firmware

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Firmware (CN & Global)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Build Firmware (gh_release_cn & gh_release)
        run: |
          pio run -e gh_release_cn -e gh_release

      - name: Stage build artifacts
        run: |
          mkdir -p dist
          cp .pio/build/gh_release_cn/firmware.bin dist/firmware-cn.bin
          cp .pio/build/gh_release_cn/bootloader.bin dist/bootloader-cn.bin
          cp .pio/build/gh_release_cn/partitions.bin dist/partitions-cn.bin
          cp .pio/build/gh_release/firmware.bin dist/firmware.bin
          ls -la dist/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crossmux-inklink-firmware
          path: dist/*
          retention-days: 30
